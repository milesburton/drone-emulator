<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Emulator</title>
    <style>
      :root {
        --panel: rgba(16, 20, 28, 0.82);
        --text: #e8edf4;
        --accent: #ffd60a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141c;
        color: var(--text);
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 240px;
        padding: 12px;
        border-radius: 8px;
        background: var(--panel);
      }
      .panel h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      label {
        display: block;
        margin: 8px 0 2px;
      }
      input[type='range'] {
        width: 100%;
      }
      button {
        margin: 8px 6px 0 0;
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #10141c;
        font-weight: 600;
        cursor: pointer;
      }
      #hud {
        position: fixed;
        right: 12px;
        bottom: 12px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--panel);
        font:
          12px/1.5 ui-monospace,
          monospace;
      }
      .legend {
        margin-top: 10px;
        font-size: 11px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="panel">
      <h1>Drone Emulator</h1>
      <label for="windX">Wind X <span id="windX-value"></span> m/s</label>
      <input id="windX" type="range" min="-20" max="20" step="1" />
      <label for="windZ">Wind Y <span id="windZ-value"></span> m/s</label>
      <input id="windZ" type="range" min="-20" max="20" step="1" />
      <label for="terrainScale">Terrain scale <span id="terrainScale-value"></span> m</label>
      <input id="terrainScale" type="range" min="10" max="150" step="5" />
      <label><input id="river" type="checkbox" /> River</label>
      <button id="random-path" type="button">Random Path</button>
      <button id="storm" type="button">Storm</button>
      <div class="legend">
        White = drone, red = EKF estimate, yellow = waypoints. Drag to orbit.
      </div>
    </div>
    <pre id="hud"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
